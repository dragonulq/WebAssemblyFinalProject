[package]
name = "wasm-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime = { version = "32.0.0", features = ["async"] }
anyhow = "1.0.80"
wasmtime-wasi = { version = "32.0.0", features = ["preview1"] }
cap-std = "3.0.0"


[[bin]]
name = "wasm-launcher"
path = "wasm_launcher.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
